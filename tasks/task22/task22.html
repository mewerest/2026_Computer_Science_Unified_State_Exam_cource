<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание N — Разбор ЕГЭ по информатике</title>
  <style>
    :root {
      --bg: #fdfdfd;
      --text: #2e2e2e;
      --accent: #1a5f8a;
      --accent-light: #eaf3f9;
      --border: #e0e0e0;
      --radius: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 2rem;
      color: var(--accent);
      border-bottom: 3px solid var(--accent);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    .placeholder {
      background-color: #fffdf5;
      border: 2px dashed #d4c048;
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      margin: 2rem 0;
    }

    .placeholder .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .placeholder p {
      color: #8a6d00;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .placeholder .small {
      color: #aaa;
      font-size: 0.9rem;
    }

    .footer-note {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      body {
        padding: 1.2rem 0.8rem;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
